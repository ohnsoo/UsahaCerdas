services:
  db:
    image: postgres:16-alpine
    container_name: usahacerdas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: usahacerdas
      POSTGRES_PASSWORD: usahacerdas_dev
      POSTGRES_DB: usahacerdas
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usahacerdas -d usahacerdas"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
